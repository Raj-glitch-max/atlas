name: go-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: go-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: gofmt (no unformatted files)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "unformatted files:"; echo "$unformatted"; exit 1
          fi

      - name: import lint self-test (dependency rules R1-R7)
        run: bash scripts/check-imports.sh --self-test

      - name: import lint (dependency rules R1-R7)
        run: bash scripts/check-imports.sh

      - name: test
        run: go test ./...

      # The race detector, which nothing ran before. Every other test in the
      # tree is sequential, so `go test ./...` exercised almost no concurrent
      # paths — a data race in Store.Delegations() (shared *Delegation pointers
      # read by the JSON encoder while MarkRevoked wrote them) survived until a
      # concurrent stress test was written. Sequential tests cannot find races;
      # only concurrent ones under -race can.
      - name: test (race detector)
        run: go test -race ./...

      # Coverage-guided fuzzing of the Verification Core. `go test ./...` above
      # only replays FuzzVerify's seed corpus as ordinary cases — it does NOT
      # mutate. This step is what makes the "coverage-guided fuzzing" claim in
      # README.md true: libFuzzer-style mutation against the two invariants the
      # target asserts (never panics; never accepts non-authentic bytes).
      #
      # 60s is the smallest budget that reliably saturates new-coverage discovery
      # on this target (locally: ~1.9M execs, 227 new interesting inputs, then
      # flat). It adds ~61s to the pipeline. A crash writes a reproducer under
      # internal/verify/testdata/fuzz/ — upload it so the failing input survives
      # the runner.
      - name: fuzz the verification core (coverage-guided)
        run: go test ./internal/verify -run=XXX -fuzz=FuzzVerify -fuzztime=60s

      - name: upload fuzz reproducer on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-reproducer
          path: internal/verify/testdata/fuzz/
          if-no-files-found: ignore
